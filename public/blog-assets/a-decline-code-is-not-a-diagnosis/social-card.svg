<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">A Decline Code Is Not a Diagnosis</title>
  <desc id="desc">Social card for an article about payment decline response translation.</desc>
  <rect width="1200" height="630" fill="#fbfaf7" />
  <rect x="58" y="58" width="1084" height="514" rx="10" fill="#fffdf8" stroke="#ded8cc" stroke-width="3" />
